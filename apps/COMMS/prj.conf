# PLACEHOLDER: copied from CDH. COMMS hardware is still being designed; adjust as concrete data comes in.
CONFIG_GPIO=y
CONFIG_CAN=y
CONFIG_CAN_STM32_FDCAN=y

# --- LOGGING & CONSOLE SETUP (RTT) ---
CONFIG_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_MAIN_STACK_SIZE=4096

# --- SPI for the radio (settings copied from the tested apps/tests/spiFlashTest) ---
CONFIG_SPI=y
CONFIG_SPI_STM32=y
CONFIG_CACHE_MANAGEMENT=y
CONFIG_DMA=n
CONFIG_SPI_STM32_DMA=n

# --- CRC (link layer, stage 1) ---
CONFIG_CRC=y

# --- Encryption: STAGE 4 (SDLS). Not used yet. Kept so the tested PSA settings are not lost. ---
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_ENTROPY_GENERATOR=y

# Lets stack headroom be measured per thread
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
