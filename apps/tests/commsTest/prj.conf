CONFIG_ZTEST=y
CONFIG_ASSERT=y

CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y
CONFIG_SPI=y
CONFIG_SPI_EMUL=y
CONFIG_EMUL=y
CONFIG_CRC=y
CONFIG_CAN=y

CONFIG_LOG=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096

# native_sim defaults to 10 ms ticks, which would turn 1 ms sleeps into 10 ms ones
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
